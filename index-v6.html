<style>

body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.5;direction:rtl}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}

main{max-width:900px;margin:0 auto;padding:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 8px;text-align:center;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer}

.row{display:flex;align-items:center;gap:8px}
.sp{flex:1;min-width:0}
.mut{color:var(--mut);font-size:14px}
.b{font-weight:700}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:16px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--acc2);color:var(--acc)}
.btn.bad{background:var(--bad2);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);direction:rtl}
input.num{direction:ltr;text-align:right}

label{display:block;font-size:14px;color:var(--mut);margin:8px 0 3px}
.tag{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:6px;padding:0 7px;font-size:13px;margin-left:4px}
.due{color:var(--bad);font-weight:700}
.ok{color:var(--acc);font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font:inherit}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:14px;max-height:92vh;overflow:auto}
@media(min-width:640px){.modalbg{align-items:center}.modal{border-radius:16px}}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#17212b;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;max-width:90%}
.toast.err{background:var(--bad)}
.tot{display:flex;justify-content:space-between;padding:4px 0}
.tot.big{font-size:18px;font-weight:700;border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
.res{border:1px solid var(--line);border-radius:10px;max-height:240px;overflow:auto;background:#fff}
.res .it{padding:10px;border-bottom:1px solid var(--line);cursor:pointer}
.res .it:last-child{border:0}
.empty{text-align:center;color:var(--mut);padding:24px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{border:1px solid var(--line);padding:6px;text-align:right}
table.t th{background:#f0f3f6}
.num-l{direction:ltr;unicode-bidi:plaintext;display:inline-block}
.inv{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}

body.home header{display:none}
main{padding-bottom:92px}
body.nonav main{padding-bottom:12px}
.hero{background:linear-gradient(160deg,#0B2247,#1B4A87);color:#fff;margin:-12px -12px 0;padding:18px 16px 56px;border-bottom:5px solid #D6A52A;border-radius:0 0 50% 50%/0 0 28px 28px}
.hero .lg{display:flex;align-items:center;gap:12px}.hero .lg svg{width:54px;height:54px;flex:none}
.hero .br{font-size:28px;font-weight:700;direction:ltr;text-align:right;line-height:1.1}.hero .br b{color:#e2bd4b}
.hero .br2{font-size:17px;font-weight:700}.hero .tg{font-size:12px;color:#d7e3f7}
.hero .wl{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
.hero .wl .h{font-size:17px;font-weight:700}.hero .dt{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:6px 12px;font-size:13px;text-align:center}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:-36px 0 12px;position:relative}
.kpi{background:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(10,42,94,.12);padding:12px 10px;text-align:center;min-width:0}
.kpi svg,.qa svg{width:26px;height:26px;stroke:#2463A6;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.kpi .k{font-size:13px;color:#6B7280;margin-top:2px}.kpi .v{font-size:20px;font-weight:700;color:#102D5A;overflow-wrap:anywhere}

.newinv{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:16px;background:linear-gradient(135deg,#102D5A,#2463A6);color:#fff;font:inherit;font-size:19px;font-weight:700;padding:16px;border-bottom:4px solid #D6A52A;box-shadow:0 6px 16px rgba(10,42,94,.25);margin-bottom:12px;cursor:pointer}
.newinv i{background:#D6A52A;color:#102D5A;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:22px;line-height:1}
.qas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:#fff;border-radius:18px;box-shadow:0 4px 14px rgba(10,42,94,.08);padding:12px;margin-bottom:12px}
.qa{background:#F6F8FC;border:1px solid #E2E6EC;border-radius:14px;padding:12px 4px;text-align:center;font-size:13px;font-weight:700;color:#102D5A;cursor:pointer;min-width:0;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.qa svg{width:28px;height:28px}
.wk{background:#fff;border-radius:18px;box-shadow:0 4px 14px rgba(10,42,94,.08);padding:14px;margin-bottom:12px}
.wk h3{margin:0 0 10px;font-size:16px;color:#102D5A}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;border-bottom:1px solid #E2E6EC;padding-bottom:2px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:#9cc3f3;border-radius:5px 5px 0 0;min-height:2px}
.bars div.t i{background:linear-gradient(#2463A6,#102D5A)}
.bl{display:flex;gap:6px;margin-top:4px}.bl span{flex:1;text-align:center;font-size:11px;color:#6B7280}
.wsum{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:14px}
.wsum b{color:#102D5A;font-size:18px;white-space:nowrap}
.up{color:#0f7a4a;font-weight:700}.dn{color:#c0392b;font-weight:700}
nav#bn{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:space-around;background:#102D5A;border-top:3px solid #D6A52A;padding:6px 4px calc(6px + env(safe-area-inset-bottom));max-width:900px;margin:0 auto}

body.nonav nav#bn{display:none}

header{background:var(--navy);border-bottom:3px solid var(--gold);box-shadow:var(--shadow)}
header h1{font-size:17px;font-weight:700}

.tag{background:var(--acc2);color:var(--navy);border-radius:8px}

.res{border-radius:12px}

.modal .mrow{display:flex;gap:10px;margin-top:14px}
.modal .mrow .btn{flex:1}
.toast{background:var(--navy);border-bottom:3px solid var(--gold);border-radius:12px}
.toast.err{background:var(--bad)}
.empty{color:var(--mut)}
.due{color:var(--bad)}

.btn.gold,.modal #mok:not(.bad),#e-save{background:var(--gold);color:var(--navy);border-bottom:2px solid var(--navy)}
.rq{color:var(--bad);font-weight:700}
.fw{position:relative}

.fw.hi input,.fw.hi select,.fw.hi textarea{padding-inline-start:42px}
.ri svg{width:28px;height:28px;stroke:var(--blue);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{padding:6px 12px}
header #backBtn{background:transparent;border:1px solid rgba(255,255,255,.55)}
header h1{text-align:center}

.bk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:10px;box-shadow:var(--shadow)}
.bk .sp{flex:1;min-width:0}

.bkact{flex-basis:100%;display:flex;gap:8px;align-items:center}

.cbar .btn{border-bottom-color:var(--gold)}
</style>

<script>
/* SupaDB: Firestore-like adapter over Supabase REST (no library). */
(function (g) {
  var CAT = { stages: 1, subjects: 1, series: 1, books: 1 };
  var CFG = g.FP_CONFIG || {};
  var SKEY = 'fp_session_v1';

  var cache = {}, loadedC = {}, subs = {}, timer = null, inflight = {};

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function chk(o) { JSON.stringify(o, function (k, v) { if (v === undefined) throw { code: 'transform_error', message: 'undefined ' + k }; return v; }); }

    if (/duplicate key|23505/i.test(txt)) return mkErr('رقم الفاتورة محجوز لفاتورة أخرى. اضغط حفظ مرة أخرى', 'dup');
    if (/owner-only/i.test(txt)) return mkErr('هذا التعديل متاح لمالك الحساب فقط', 'perm');
    if (/not allowed/i.test(txt) || status === 401 || status === 403) return mkErr('الحساب غير مصرح له. سجّل الدخول من جديد', 'auth');
    return mkErr(txt || 'تعذر التنفيذ', 'err');
  }
  function saveSess() { try { if (sess) localStorage.setItem(SKEY, JSON.stringify(sess)); else localStorage.removeItem(SKEY); } catch (e) {} }
  function setSess(j) { sess = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, email: (j.user && j.user.email) || (sess && sess.email) || '' }; saveSess(); }
  async function authCall(grant, body) {
    var r;
    try { r = await fetch(CFG.url + '/auth/v1/token?grant_type=' + grant, { method: 'POST', headers: { apikey: CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
    catch (e) { throw mkErr('تعذر الاتصال بالإنترنت', 'net'); }

    return j;
  }
  async function token() {
    if (!sess) throw mkErr('سجّل الدخول أولًا', 'auth');
    if (sess.expires_at - Date.now() < 60000) {
      try { setSess(await authCall('refresh_token', { refresh_token: sess.refresh_token })); }
      catch (e) { if (e.code === 'login') { sess = null; saveSess(); if (g.FP_onAuthLost) g.FP_onAuthLost(); } throw e; }
    }

  }
  async function rest(method, path, body, extra) {
    var t = await token(), r;
    var h = { apikey: CFG.key, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' };
    if (extra) for (var k in extra) h[k] = extra[k];
    try { r = await fetch(CFG.url + '/rest/v1/' + path, { method: method, headers: h, body: body === undefined ? undefined : JSON.stringify(body) }); }
    catch (e) { throw mkErr('تعذر الاتصال بالإنترنت', 'net'); }
    var txt = await r.text(), j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) { j = null; }
    if (!r.ok) throw friendly(j && (j.message || j.details || j.hint) ? (j.message || '') + ' ' + (j.details || '') : txt, r.status);
    return j;
  }
  async function fetchRows(coll, o) {
    o = o || {};
    var base = tbl(coll) + '?select=id,data,version&coll=eq.' + encodeURIComponent(coll);

    var out = [], off = 0, page = 1000;

      var rows = await rest('GET', base + '&order=id.asc&limit=' + page + '&offset=' + off);

    }
    return out;
  }
  function sig(m) { var s = []; for (var id in m) s.push(id + ':' + m[id].version); return s.sort().join('|'); }
  async function load(coll) {

  function snapDoc(coll, id) {
    var m = cache[coll] && cache[coll][id];

  }

  async function apply(ops) { return rest('POST', 'rpc/apply_ops', { ops: ops }); }

  function docRef(path) {
    var i = path.indexOf('/'), coll = path.slice(0, i), id = path.slice(i + 1);
    return {
      id: id, path: path,
      get: async function () {
        var rows = await rest('GET', tbl(coll) + '?select=id,data,version&coll=eq.' + encodeURIComponent(coll) + '&id=eq.' + encodeURIComponent(id));

/* ---------- modal helpers ---------- */
function modal(html) { var bg = document.createElement('div'); bg.className = 'modalbg'; bg.innerHTML = '<div class="modal">' + html + '</div>'; document.body.appendChild(bg); return bg; }
function closeModal(bg) { bg.remove(); }
function confirmModal(msg, okLabel, fn) {
  var bg = modal('<div class="mt">تأكيد</div><p style="margin-top:8px">' + esc(msg) + '</p><div class="mrow"><button class="btn bad" id="mok">' + esc(okLabel || 'تأكيد') + '</button><button class="btn sec" id="mno">إلغاء</button></div>');
  $('#mno', bg).onclick = function () { closeModal(bg); };
  $('#mok', bg).onclick = async function () { var b = this; if (b.disabled) return; b.disabled = true; try { await fn(); closeModal(bg); } catch (e) { toast('تعذر التنفيذ: ' + errText(e), true); b.disabled = false; } };
}
function formModal(cfg) {
  var h = '<div class="mt">' + esc(cfg.title) + '</div>';
  cfg.fields.forEach(function (f) {
    h += '<label>' + esc(f.label) + (f.req ? ' <span class="rq">*</span>' : '') + '</label><div class="fw' + (f.ic ? ' hi' : '') + '">';
    if (f.type === 'select') h += '<select data-f="' + f.k + '"><option value="">— اختر —</option>' + f.options.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === f.value ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';
    else if (f.type === 'area') h += '<textarea rows="2" data-f="' + f.k + '">' + esc(f.value) + '</textarea>';
    else h += '<input data-f="' + f.k + '"' + (f.num ? ' class="num" inputmode="' + (f.dec ? 'decimal' : 'numeric') + '"' : '') + ' value="' + esc(f.value) + '">';
    h += (f.ic ? ico(f.ic) : '') + '</div>';
  });
  h += '<div id="mlive" class="mut" style="margin-top:8px;min-height:20px"></div><div id="merr" class="due"></div><div class="mrow"><button class="btn" id="mok">حفظ</button><button class="btn sec" id="mno">إلغاء</button></div>';
  var bg = modal(h);
  var vals = function () { var v = {}; bg.querySelectorAll('[data-f]').forEach(function (el) { v[el.dataset.f] = el.value; }); return v; };
  var live = function () { if (cfg.live) $('#mlive', bg).innerHTML = cfg.live(vals()); };
  bg.addEventListener('input', live); bg.addEventListener('change', live); live();
  $('#mno', bg).onclick = function () { closeModal(bg); };
  $('#mok', bg).onclick = async function () {
    var b = this; if (b.disabled) return; b.disabled = true;
    try { var err = await cfg.ok(vals()); if (err) { $('#merr', bg).textContent = err; b.disabled = false; } else { closeModal(bg); toast('تم الحفظ'); } }
    catch (e) { $('#merr', bg).textContent = 'تعذر الحفظ: ' + errText(e); b.disabled = false; }
  };
  var first = bg.querySelector('input,select'); if (first && !first.value) first.focus();
}

  serDel: function (d) { var x = byId('series', d.id), u = NAMECFG.series.used(d.id); if (u) { toast(u + ' — يمكنك تعطيلها بدل الحذف', true); return; } confirmModal('حذف السلسلة «' + x.name + '»؟', 'حذف', async function () { await db.doc('series/' + x.id).delete(); log('حذف سلسلة', x.id, x.name); }); },
  bookAdd: function () { bookForm(null); },
  pickNewBook: function () { if (!E || !E.pSer || !E.pSub || !E.pStg) return; bookForm(null, { seriesId: E.pSer, subjectId: E.pSub, stageId: E.pStg, name: nm('series', E.pSer) + ' ' + nm('subjects', E.pSub) }); },
  bookEdit: function (d) { bookForm(byId('books', d.id)); },
  bookDel: function (d) { var b = byId('books', d.id); confirmModal('حذف الكتاب «' + b.name + '»؟ الفواتير القديمة تبقى كما هي.', 'حذف', async function () { await db.doc('books/' + b.id).delete(); log('حذف كتاب', b.id, b.name); }); },
  priceSave: async function () {
    if (busy) return; busy = true;
    try {
      var p = L.parseDecimal($('#pp').value, 1000), l = L.parseDecimal($('#pl').value, 1000);
      if (p == null || l == null) { toast('اكتب أرقامًا صحيحة للسعرين', true); return; }
      var s = S.settings || {};
      if (s.paperMilli === p && s.laborMilli === l) { toast('لا يوجد تغيير'); return; }
      var hist = (s.history || []).concat([{ at: Date.now(), paperMilli: p, laborMilli: l }]).slice(-50);
      await db.doc('settings/main').set({ paperMilli: p, laborMilli: l, history: hist });
      log('تغيير الأسعار', 'settings', 'الورقة ' + L.fmtMilli(p) + ' — البشر ' + L.fmtMilli(l)); toast('تم حفظ الأسعار');
    } catch (e) { toast('تعذر الحفظ: ' + errText(e), true); } finally { busy = false; }
  },
  partyAdd: function (d) { V.afterAdd = null; partyForm(d.kind, null); },
  partyEdit: function (d) { partyForm(d.kind, byId(d.kind, d.id)); },
  partyDel: function (d) {

    confirmModal('حذف «' + p.name + '»؟', 'حذف', async function () { await db.doc(d.kind + '/' + p.id).delete(); log('حذف', p.id, p.name); back(); });
  },
  quickParty: function (d) { V.afterAdd = function (id) { if (E) { if (E.kind === 'sales') E.customerId = id; else E.supplierId = id; setTimeout(updateEditorLists, 300); } }; partyForm(d.kind, null); },
  saleNew: function () { openSaleEditor(null); },
  purNew: function () { openPurEditor(null); },
  saleEdit: function (d) { openSaleEditor(byId('sales', d.id)); },
  purEdit: function (d) { openPurEditor(byId('purchases', d.id)); },
  saleDel: function (d) { delInvoice('sales', d.id); },
  purDel: function (d) { delInvoice('purchases', d.id); },
  eCancel: function () { confirmModal('إلغاء الفاتورة وفقدان ما أُدخل؟', 'نعم، إلغاء', async function () { back(); }); },
  eSave: saveEditor,
  addBook: function (d) {
    var b = byId('books', d.id); if (!b || !selectable(b)) { toast('هذا الكتاب غير متاح للاختيار', true); return; }
    if (!isPriced(b)) { pricingForm(b, true); return; }
    addBookLine(b, bookPrice(b), effPages(b), priceRec(b));
  },
  newBookFromSearch: function () {
    if (!E) return;
    var q = (E.q || '').trim(), auto = [E.pSer ? nm('series', E.pSer) : '', E.pSub ? nm('subjects', E.pSub) : '', E.pStg ? nm('stages', E.pStg) : ''].filter(Boolean).join(' ');
    bookForm(null, { name: q || auto, seriesId: E.pSer, subjectId: E.pSub, stageId: E.pStg });
  },
  moreBooks: function () { E.limit = (E.limit || 40) + 40; renderPickList(); },
  toPick: function () { setStep('pick'); },
  toCart: function () { setStep('cart'); },
  toDetails: function () {
    if (!E.lines.length) { toast('أضف كتابًا واحدًا على الأقل', true); return; }
    var errs = L.validateSales({ customerId: 'x', date: 'x', lines: E.lines.map(function (l) { var pl = parseLine(l); return { qty: pl.qty, unitPrice: pl.unitPrice }; }), paid: 0 });
    if (errs.length) { toast(errs[0], true); return; }
    setStep('details');
  },
  pickInc: function (d) { var i = lineOf(d.id); if (i < 0) return; var q = pInt(E.lines[i].qtyStr); E.lines[i].qtyStr = String((isNaN(q) ? 0 : q) + 1); renderPickList(); },
  pickDec: function (d) { var i = lineOf(d.id); if (i < 0) return; var q = pInt(E.lines[i].qtyStr); q = isNaN(q) ? 0 : q - 1; if (q <= 0) E.lines.splice(i, 1); else E.lines[i].qtyStr = String(q); renderPickList(); },
  cartInc: function (d) { var l = E.lines[+d.i], q = pInt(l.qtyStr); l.qtyStr = String((isNaN(q) ? 0 : q) + 1); var el = $('#q' + d.i); if (el) el.value = l.qtyStr; cartRecalc(); },
  cartDec: function (d) { var l = E.lines[+d.i], q = pInt(l.qtyStr); q = isNaN(q) ? 1 : q; if (q > 1) l.qtyStr = String(q - 1); var el = $('#q' + d.i); if (el) el.value = l.qtyStr; cartRecalc(); },
  cartDel: function (d) { E.lines.splice(+d.i, 1); $('#e-cart').innerHTML = cartView(); cartRecalc(); },
  editPricing: function (d) { var b = byId('books', d.id); if (!b) return; pricingForm(b, false); },
  addPurLine: function () { E.lines.push({ key: newKey(), itemId: '', qtyStr: '', priceStr: '' }); renderLines(); recalc(); },
  delLine: function (d) { E.lines.splice(+d.i, 1); renderLines(); recalc(); },
  itemAdd: function () { itemForm(null); },
  itemEdit: function (d) { itemForm(byId('items', d.id)); },
  itemDel: function (d) {
    var x = byId('items', d.id);
    if (S.purchases.some(function (inv) { return inv.lines.some(function (l) { return l.itemId === x.id; }); })) { toast('لا يمكن الحذف: الصنف مستخدم في فواتير شراء', true); return; }
    confirmModal('حذف الصنف «' + x.name + '»؟', 'حذف', async function () { await db.doc('items/' + x.id).delete(); log('حذف صنف', x.id, x.name); });
  },
  printSale: async function (d) {
    var inv = byId('sales', d.id);
    try { var dl = await claude.use('downloads'); if (!dl) { toast('الحفظ غير متاح هنا', true); return; } await dl.save({ filename: 'فاتورة-' + inv.number + '.html', data: printHTML(inv) }); }
    catch (e) { if (!e || e.code !== 'declined') toast('تعذر حفظ الملف: ' + errText(e), true); }
  }
};
function itemForm(x) {
  if (!S.itemTypes.length || !S.units.length) { toast('أضف نوعًا ووحدة قياس أولًا (من زر أنواع الأصناف ووحدات القياس)', true); return; }
  var opt = function (col) { return sortAr(S[col], function (y) { return y.name; }).map(function (y) { return [y.id, y.name]; }); };
  formModal({ title: x ? 'تعديل صنف' : 'إضافة صنف', fields: [{ k: 'name', label: 'اسم الصنف (مثال: ورق 70 جرام 70×100)', value: x ? x.name : '' }, { k: 'typeId', label: 'النوع', type: 'select', options: opt('itemTypes'), value: x ? x.typeId : '' }, { k: 'unitId', label: 'وحدة القياس', type: 'select', options: opt('units'), value: x ? x.unitId : '' }],
    ok: async function (v) { var n = v.name.trim(); if (!n) return 'اكتب اسم الصنف'; if (!v.typeId || !v.unitId) return 'اختر النوع والوحدة'; var data = { name: n, typeId: v.typeId, unitId: v.unitId }; if (x) { await db.doc('items/' + x.id).set(data); log('تعديل صنف', x.id, n); } else { var r = db.collection('items').doc(); await r.set(data); log('إضافة صنف', r.id, n); } return null; } });
}
function delInvoice(col, id) {
  var inv = byId(col, id), isS = col === 'sales';
  confirmModal('حذف فاتورة ' + (isS ? 'البيع' : 'الشراء') + ' رقم ' + inv.number + '؟ ' + (isS ? 'سيُعاد حساب مديونية العميل.' : 'سيُعاد حساب حساب المورد ويُخصم دخولها من المخزون.'), 'حذف الفاتورة', async function () {
    var t = (isS ? L.salesTotals : L.purchaseTotals)(inv.lines, inv.paid);
    await db.doc(col + '/' + id).delete();
    await log('حذف فاتورة ' + (isS ? 'بيع #' : 'شراء #') + inv.number, id, (isS ? inv.customerName : inv.supplierName) + ' — إجمالي ' + L.fmt(t.total) + ' — مدفوع ' + L.fmt(inv.paid));
    back();
  });
}

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  var f = ACT[el.dataset.act]; if (f) f(el.dataset, el);
});
document.addEventListener('input', function (e) {
  var el = e.target, k = el.dataset && el.dataset.in; if (!k) return;
  if (k === 'bq') { V.q = el.value; var q = norm(V.q); $('#blist').innerHTML = bookRows(sortAr(S.books.filter(function (b) { return !q || norm([b.name, nm('series', b.seriesId), nm('stages', b.stageId), nm('subjects', b.subjectId)].join(' ')).indexOf(q) >= 0; }), function (b) { return b.name; })); }
  else if (k === 'pq') { V.q = el.value; var kind = V.name; var qq = norm(V.q); $('#plist').innerHTML = partyRows(kind, sortAr(S[kind].filter(function (p) { return !qq || norm(p.name + ' ' + (p.phone || '')).indexOf(qq) >= 0; }), function (p) { return p.name; }), kind === 'customers' ? S.sales : S.purchases); }
  else if (k === 'sq') { V.q = el.value; $('#slist').innerHTML = serRows(); }
  else if (k === 'iq') { V.q = el.value; $('#ilist').innerHTML = invRows(V.name); }
  else if (k === 'esearch') { E.q = el.value; E.limit = 40; renderPickList(); }
  else if (k === 'edate') { E.date = el.value; }
  else if (k === 'epaid') { E.paidStr = el.value; recalc(); }
  else if (k === 'lterm') { E.lines[+el.dataset.i].term = el.value; }
  else if (k === 'lqty') { E.lines[+el.dataset.i].qtyStr = el.value; recalc(); }
  else if (k === 'lprice') { E.lines[+el.dataset.i].priceStr = el.value; recalc(); }
});
document.addEventListener('change', function (e) {
  var el = e.target, k = el.dataset && el.dataset.in; if (!k) return;
  if (k === 'pser') { E.pSer = el.value; E.limit = 40; renderPickList(); }
  else if (k === 'psub') { E.pSub = el.value; E.limit = 40; renderPickList(); }
  else if (k === 'pstg') { E.pStg = el.value; E.limit = 40; renderPickList(); }
  else if (k === 'spub') { V.pub = el.value; $('#slist').innerHTML = serRows(); }
  else if (k === 'sst') { V.st = el.value; $('#slist').innerHTML = serRows(); }
  else if (k === 'eparty') { if (E.kind === 'sales') E.customerId = el.value; else E.supplierId = el.value; }
  else if (k === 'litem') { E.lines[+el.dataset.i].itemId = el.value; }
});

/* ---------- web additions: backup view, login, boot ---------- */
IC.backup = '<path d="M12 3v11M7.5 9.5 12 14l4.5-4.5M4 17v3h16v-3"/>';
QA.push(['backup', 'النسخ الاحتياطي والحساب']);
VIEWS.backup = function () {
  return '<div class="card"><div class="b">تصدير نسخة كاملة</div><div class="mut">ينزّل ملفًا فيه كل بياناتك (الحصر والعملاء والموردون والفواتير والسجل). احتفظ به كل أسبوع في مكان آمن.</div><button class="btn gold" data-act="bkExport" style="margin-top:10px">تصدير نسخة كاملة</button></div>' +
    '<div class="card"><div class="b">استيراد بيانات من ملف</div><div class="mut">يضيف البيانات الناقصة فقط ولا يستبدل أي سجل موجود.</div><input type="file" id="bkfile" accept="application/json,.json" style="margin-top:10px"><button class="btn" data-act="bkImport" style="margin-top:10px">استيراد</button><div id="bkmsg" class="mut" style="margin-top:8px"></div></div>' +
    '<div class="card"><div class="b">الحساب</div><div class="mut">' + esc(db.email ? db.email() : '') + '</div><button class="btn" data-act="logout" style="margin-top:10px">تسجيل الخروج</button></div>';
};
function webDownload(name, text, mime) {
  var b = new Blob([text], { type: mime || 'text/html;charset=utf-8' }), u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
}
window.claude = { use: async function (n) { return n === 'downloads' ? { save: async function (r) { webDownload(r.filename, r.data); return { status: 'saved' }; } } : null; } };
ACT.bkExport = async function (d, el) {
  if (el) el.disabled = true;
  try { var pkg = await db.exportAll(); if (!pkg) throw new Error('لا توجد صلاحية'); var dt = new Date().toISOString().slice(0, 10); webDownload('fares-print-backup-' + dt + '.json', JSON.stringify(pkg), 'application/json'); toast('تم تنزيل النسخة الكاملة'); }
  catch (e) { toast('تعذر التصدير: ' + errText(e), true); }
  if (el) el.disabled = false;
};
ACT.bkImport = async function (d, el) {
  var f = $('#bkfile') && $('#bkfile').files[0], msg = $('#bkmsg');
  if (!f) { toast('اختر ملف النسخة أولًا', true); return; }
  el.disabled = true;
  try {
    var pkg = JSON.parse(await f.text());
    if (!pkg || (!pkg.docs && !pkg.catalog)) throw new Error('الملف غير صالح');
    var r = await db.importAll(pkg, function (n, t) { msg.textContent = 'جاري الاستيراد… ' + n + ' / ' + t; });
    msg.textContent = 'تم: أُضيف ' + r.added + ' سجل، وتم تخطي ' + r.skipped + ' موجود بالفعل. حدّث الصفحة لرؤية البيانات.';
    toast('تم الاستيراد');
  } catch (e) { msg.textContent = 'تعذر الاستيراد: ' + errText(e); toast('تعذر الاستيراد', true); }
  el.disabled = false;
};
ACT.logout = function () { confirmModal('تسجيل الخروج؟', 'خروج', async function () { db.signOut(); location.reload(); }); };

function showLogin(msg) {
  document.body.classList.remove('home'); $('#bn').innerHTML = ''; $('#bn').style.display = 'none'; var hb = document.querySelector('header [data-act=home]'); if (hb) hb.style.display = 'none'; $('#title').textContent = 'تسجيل الدخول'; $('#backBtn').style.display = 'none';
  $('#app').innerHTML = '<div class="card" style="margin-top:24px"><div class="b" style="font-size:18px;margin-bottom:12px">Fares Print — مطبعة فارس</div>' +
    '<label class="mut">البريد الإلكتروني</label><input id="lg-email" type="email" autocomplete="username" dir="ltr" style="width:100%;margin:6px 0 12px">' +
    '<label class="mut">كلمة المرور</label><input id="lg-pw" type="password" autocomplete="current-password" dir="ltr" style="width:100%;margin:6px 0 12px">' +
    '<div id="lg-err" class="mut" style="color:var(--bad);min-height:20px">' + esc(msg || '') + '</div>' +
    '<button class="btn gold" id="lg-go" style="width:100%;margin-top:8px">دخول</button></div>';
  var go_ = async function () {
    var b = $('#lg-go'), em = $('#lg-email').value.trim(), pw = $('#lg-pw').value;
    if (!em || !pw) { $('#lg-err').textContent = 'اكتب البريد وكلمة المرور'; return; }
    b.disabled = true; $('#lg-err').textContent = '';
    try { await db.signIn(em, pw); startApp(); } catch (e) { $('#lg-err').textContent = e.message || 'تعذر الدخول'; b.disabled = false; }
  };
  $('#lg-go').onclick = go_; $('#lg-pw').onkeydown = function (e) { if (e.key === 'Enter') go_(); };
}
window.FP_onAuthLost = function () { showLogin('انتهت الجلسة. سجّل الدخول من جديد'); };
var started = false;
function startApp() {
  if (started) return; started = true;
  $('#bn').style.display = ''; var hb = document.querySelector('header [data-act=home]'); if (hb) hb.style.display = '';
  $('#app').innerHTML = '<div class="empty">جاري التحميل…</div>';
  var timer = setTimeout(function () { if (!allLoaded()) $('#app').innerHTML = '<div class="empty">تعذر الوصول للبيانات بعد. تأكد من الاتصال بالإنترنت وانتظر قليلًا.</div>'; }, 15000);
  var fail = function (e) { if (e && e.code === 'auth') { started = false; db.signOut(); showLogin('سجّل الدخول من جديد'); return; } $('#app').innerHTML = '<div class="empty">تعذر تحميل البيانات: ' + esc(errText(e)) + '</div>'; };
  COLS.forEach(function (c) {
    db.collection(c).onSnapshot(function (snap) { S[c] = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }); loaded[c] = true; if (allLoaded()) clearTimeout(timer); refresh(); }, fail);
  });
  db.doc('settings/main').onSnapshot(function (s) { S.settings = s.exists ? s.data() : null; loaded.settings = true; if (allLoaded()) clearTimeout(timer); refresh(); }, fail);
}
(function () { db = window.SupaDB; if (db.hasSession()) startApp(); else showLogin(); })();
})();
</script>
